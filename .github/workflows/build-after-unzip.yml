name: Build After Auto Unzip

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Auto Unzip Diagnostic Patch
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: build-after-unzip-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    # Manual runs are allowed; automatic runs require successful unzip on master.
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_run' &&
           github.event.workflow_run.conclusion == 'success' &&
           github.event.workflow_run.head_branch == 'master' &&
           github.event.workflow_run.head_repository.full_name == github.repository) }}
    runs-on: ubuntu-latest
    steps:
      # Do not checkout workflow_run.head_sha: that is the commit BEFORE unzip
      # created its patch commit. Checkout the updated branch instead.
      - name: Checkout patched repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build CloudStream stable debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStableDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-stable-debug-apk
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: error
