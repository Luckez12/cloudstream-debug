name: CloudStream Diagnostic APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'cloudstream-diagnostic-patch.zip'
      - '.github/workflows/build-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: cloudstream-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate ZIP (only expected repo-relative app files)
        shell: bash
        run: |
          python3 - <<'PYVALIDATE'
          from pathlib import PurePosixPath
          import stat
          from zipfile import ZipFile
          archive = 'cloudstream-diagnostic-patch.zip'
          expected = {
              'app/src/main/java/com/lagradost/cloudstream3/utils/diagnostics/DiagnosticLog.kt',
              'app/src/main/java/com/lagradost/cloudstream3/utils/diagnostics/DiagnosticDialog.kt',
              'app/src/main/java/com/lagradost/cloudstream3/ui/APIRepository.kt',
              'app/src/main/java/com/lagradost/cloudstream3/ui/player/RepoLinkGenerator.kt',
              'app/src/main/java/com/lagradost/cloudstream3/ui/player/CS3IPlayer.kt',
              'app/src/main/java/com/lagradost/cloudstream3/ui/settings/SettingsGeneral.kt',
              'app/src/main/java/com/lagradost/cloudstream3/ui/settings/SettingsGeneralScreen.kt',
              'app/src/main/res/xml/settings_general.xml',
          }
          with ZipFile(archive) as z:
              names = [item.filename for item in z.infolist()]
              assert len(names) == len(expected) and set(names) == expected, 'ZIP layout does not match this patch version'
              for item in z.infolist():
                  name = PurePosixPath(item.filename)
                  assert '..' not in name.parts and not name.is_absolute(), f'Unsafe path: {name}'
                  assert not stat.S_ISLNK(item.external_attr >> 16), f'Symlink forbidden: {name}'
                  assert item.file_size < 2000000, f'File too large: {name}'
          print('ZIP contents and paths OK')
          PYVALIDATE

      - name: Unzip patch into the repository root
        run: unzip -o -q cloudstream-diagnostic-patch.zip -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform used by this repository
        run: sdkmanager --install 'platforms;android-37'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build standalone debug APK (no signing secrets)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleStableDebug

      - name: Upload APK, even if build reports a problem
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-diagnostic-debug-apk
          path: app/build/outputs/apk/stable/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
