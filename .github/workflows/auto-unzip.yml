name: Auto Unzip Diagnostic Patch

on:
  push:
    paths:
      - '*.zip'
      - '**/*.zip'
      - '*.ZIP'
      - '**/*.ZIP'
      - '.github/workflows/auto-unzip.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-unzip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unzip:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Unzip all ZIPs and delete each only after success
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          root = Path.cwd()
          archives = sorted(
              path for path in root.rglob('*')
              if path.is_file() and path.suffix.lower() == '.zip'
              and not any(part in {'.git', '.gradle', 'build'} for part in path.relative_to(root).parts)
          )
          if not archives:
              print('No ZIP files to extract.')

          for archive in archives:
              print(f'Extracting: {archive.relative_to(root)}', flush=True)
              with ZipFile(archive) as zip_file:
                  # Check all archive members before writing anything.
                  for item in zip_file.infolist():
                      name = item.filename
                      parts = PurePosixPath(name).parts
                      mode = (item.external_attr >> 16) & 0o170000
                      if (not name or name.startswith('/') or '\\' in name
                          or '..' in parts or '.git' in parts
                          or mode == 0o120000
                          or name.startswith('.github/workflows/')):
                          raise ValueError(f'Unsafe ZIP entry in {archive.name}: {name!r}')
                  zip_file.extractall(root)
              # Reached only after successful extraction.
              archive.unlink()
              print(f'Extracted and deleted: {archive.relative_to(root)}', flush=True)
          PY

      - name: Commit extracted files and ZIP deletions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Auto unzip uploaded ZIP files'
          git push origin "HEAD:${GITHUB_REF_NAME}"
