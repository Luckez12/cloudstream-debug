name: Auto Unzip Diagnostic Patch

on:
  push:
    paths:
      - 'cloudstream-diagnostic-patch.zip'
      - '.github/workflows/auto-unzip.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-unzip-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unzip:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract patch into repository root
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f cloudstream-diagnostic-patch.zip ]]; then
            echo 'Patch ZIP not found; nothing to unzip.'
            exit 0
          fi
          # Reject absolute paths, parent traversal and Windows-style separators.
          python3 - <<'PY'
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          archive = 'cloudstream-diagnostic-patch.zip'
          with ZipFile(archive) as z:
              for item in z.infolist():
                  name = item.filename
                  parts = PurePosixPath(name).parts
                  if (not name or name.startswith('/') or '\\' in name
                          or '..' in parts or '.git' in parts or name.startswith('.github/workflows/')
                          or (item.external_attr >> 16) & 0o170000 == 0o120000):
                      raise SystemExit(f'Unsafe archive entry: {name!r}')
          PY
          unzip -o -q cloudstream-diagnostic-patch.zip -d .
          # Only delete the archive after unzip exits successfully.
          rm -- cloudstream-diagnostic-patch.zip

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No extracted changes to commit.'
            exit 0
          fi
          git commit -m 'Apply CloudStream diagnostic patch'
          git push origin "HEAD:${GITHUB_REF_NAME}"
